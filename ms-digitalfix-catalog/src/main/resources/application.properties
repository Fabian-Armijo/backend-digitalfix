# Configuración del Servidor (Puerto 8082 para no chocar con el 8081 de workorders)
server.port=8082

# Nombre de la aplicación
spring.application.name=ms-digitalfix-catalog

# Importación nativa del archivo .env (El './' fuerza a buscar en la raíz exacta)
spring.config.import=optional:file:./.env

# Configuración de la Base de Datos PostgreSQL usando las variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true