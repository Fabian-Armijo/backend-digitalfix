server.port=8085
spring.application.name=ms-digitalfix-notifications

# Configuracion de RabbitMQ (Cluster de alta disponibilidad)
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3000

# Modo de confirmacion manual explicita (Pauta: Indicador 5 - ACK manual y control de flujo)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Reintentos de consumo en caso de fallo
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms

# Nombres centralizados de Topologia RabbitMQ (Pauta: Indicador 1)
app.rabbitmq.exchange.workorders=${RABBITMQ_WORKORDERS_EXCHANGE:workorders.exchange}
app.rabbitmq.queue.notifications=${RABBITMQ_NOTIFICATIONS_QUEUE:workorders.notifications.queue}
app.rabbitmq.routing-key.notifications=workorder.#
app.rabbitmq.exchange.dlx=${RABBITMQ_DLX_EXCHANGE:workorders.dlx}
app.rabbitmq.queue.dlq=${RABBITMQ_NOTIFICATIONS_DLQ:workorders.notifications.dlq}
app.rabbitmq.routing-key.dlq=workorders.notifications.dlq.key

# Configuracion de Correo Electronico (SMTP / Mailtrap / Gmail)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Correo remitente por defecto
app.mail.from=${MAIL_FROM:notificaciones@digitalfix.com}

spring.config.import=optional:file:.env
