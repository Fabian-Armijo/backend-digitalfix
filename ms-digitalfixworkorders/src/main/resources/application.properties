# Configuracion del Servidor
server.port=8081
spring.application.name=ms-digitalfixworkorders

# Configuracion de Base de Datos
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digitalfix}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de RabbitMQ (Cluster de alta disponibilidad)
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3000

# Nombres centralizados de Topologia RabbitMQ (Pauta: Indicador 1)
app.rabbitmq.exchange.workorders=${RABBITMQ_WORKORDERS_EXCHANGE:workorders.exchange}
app.rabbitmq.routing-key.created=workorder.created
app.rabbitmq.routing-key.status-changed=workorder.status.changed
app.rabbitmq.routing-key.assigned=workorder.assigned

spring.config.import=optional:file:.env

# Configuracion de Apache Kafka (Productor Optimizado de Auditoria)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
app.kafka.topic.audit=${KAFKA_AUDIT_TOPIC:workorders.audit.events}
app.kafka.topic.stress=${KAFKA_STRESS_TOPIC:workorders.stress.test}
app.kafka.topic.partitions=${KAFKA_DEFAULT_PARTITIONS:3}
app.kafka.topic.replicas=${KAFKA_DEFAULT_REPLICAS:2}
app.kafka.producer.batch-size=${KAFKA_PRODUCER_BATCH_SIZE:32768}
app.kafka.producer.linger-ms=${KAFKA_PRODUCER_LINGER_MS:10}
app.kafka.producer.compression-type=${KAFKA_PRODUCER_COMPRESSION:snappy}
app.kafka.producer.acks=${KAFKA_PRODUCER_ACKS:all}
