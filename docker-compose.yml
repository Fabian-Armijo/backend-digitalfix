services:
  # 1. Base de datos PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: digitalfix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: digitalfix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-seeds.sql:/docker-entrypoint-initdb.d/init-seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - digitalfix-network

  # 2. Microservicio de Catálogo y Repuestos (Puerto 8082)
  catalog-service:
    build:
      context: ./ms-digitalfix-catalog
      dockerfile: Dockerfile
    container_name: ms-digitalfix-catalog
    restart: unless-stopped
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: digitalfix
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
    ports:
      - "8082:8082"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - digitalfix-network

  # 3. Microservicio de Órdenes de Trabajo (Puerto 8081)
  workorders-service:
    build:
      context: ./ms-digitalfixworkorders
      dockerfile: Dockerfile
    container_name: ms-digitalfixworkorders
    restart: unless-stopped
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: digitalfix
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - digitalfix-network

  # 4. Microservicio de Técnicos (Puerto 8084)
  technicians-service:
    build:
      context: ./ms-digitalfix-technicians
      dockerfile: Dockerfile
    container_name: ms-digitalfix-technicians
    restart: unless-stopped
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: digitalfix
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
    ports:
      - "8084:8084"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - digitalfix-network

  # 5. Backend For Frontend (BFF / Gateway) (Puerto 8083)
  bff-service:
    build:
      context: ./ms-digitalfix-bff
      dockerfile: Dockerfile
    container_name: ms-digitalfix-bff
    restart: unless-stopped
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-f01230ab-9e94-4c94-8ce2-d2c2b31558dc}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-ece96448-d15c-403e-9525-fefc4f9378a1}
      CATALOG_URL: http://catalog-service:8082
      WORKORDERS_URL: http://workorders-service:8081
      TECHNICIANS_URL: http://technicians-service:8084
    ports:
      - "8083:8083"
    depends_on:
      - catalog-service
      - workorders-service
      - technicians-service
    networks:
      - digitalfix-network

volumes:
  postgres_data:

networks:
  digitalfix-network:
    driver: bridge
