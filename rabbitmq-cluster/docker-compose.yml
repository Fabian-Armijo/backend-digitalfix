services:
  haproxy:
    image: haproxy:2.8-alpine
    container_name: rabbitmq-haproxy
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - rabbitmq-node1
      - rabbitmq-node2
      - rabbitmq-node3

  rabbitmq-node1:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-node1
    hostname: rabbitmq-node1
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: "DIGITALFIX_CLUSTER_SECRET_COOKIE_2026"
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    volumes:
      - rabbitmq_node1_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  rabbitmq-node2:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-node2
    hostname: rabbitmq-node2
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: "DIGITALFIX_CLUSTER_SECRET_COOKIE_2026"
    volumes:
      - rabbitmq_node2_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      - rabbitmq-node1

  rabbitmq-node3:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-node3
    hostname: rabbitmq-node3
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: "DIGITALFIX_CLUSTER_SECRET_COOKIE_2026"
    volumes:
      - rabbitmq_node3_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      - rabbitmq-node1

volumes:
  rabbitmq_node1_data:
  rabbitmq_node2_data:
  rabbitmq_node3_data:
