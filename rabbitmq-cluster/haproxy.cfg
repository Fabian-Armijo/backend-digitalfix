global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# Balanceo de Mensajería AMQP (Puerto 5672)
frontend rabbitmq_amqp_front
    bind *:5672
    mode tcp
    default_backend rabbitmq_amqp_back

backend rabbitmq_amqp_back
    mode tcp
    balance roundrobin
    server rabbitmq-node1 rabbitmq-node1:5672 check
    server rabbitmq-node2 rabbitmq-node2:5672 check
    server rabbitmq-node3 rabbitmq-node3:5672 check

# Balanceo del Panel Web (Puerto 15672)
frontend rabbitmq_mgmt_front
    bind *:15672
    mode tcp
    default_backend rabbitmq_mgmt_back

backend rabbitmq_mgmt_back
    mode tcp
    balance source
    server rabbitmq-node1 rabbitmq-node1:15672 check
    server rabbitmq-node2 rabbitmq-node2:15672 check
    server rabbitmq-node3 rabbitmq-node3:15672 check
