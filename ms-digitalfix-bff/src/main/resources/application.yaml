server:
  port: 8083 # El BFF será la puerta de entrada principal para el Frontend

spring:
  application:
    name: ms-digitalfix-bff

  # Importación nativa del archivo .env forzando la búsqueda en el directorio actual
  config:
    import: optional:file:./.env

  # Configuración de Seguridad para MSAL (Validación JWT automática)
  security:
    oauth2:
      resourceserver:
        jwt:
          # URL oficial de Microsoft para validar la autenticidad de los tokens
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:f01230ab-9e94-4c94-8ce2-d2c2b31558dc}/v2.0
          # Audiencia esperada (tu aplicación)
          audiences:
            - api://${AZURE_CLIENT_ID:ece96448-d15c-403e-9525-fefc4f9378a1}
            - ${AZURE_CLIENT_ID:ece96448-d15c-403e-9525-fefc4f9378a1}

  # Configuración del Gateway: Enrutamiento del tráfico hacia tus microservicios
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Ruta hacia el microservicio de órdenes de trabajo
            - id: workorders-service
              uri: ${WORKORDERS_URL:http://localhost:8081}
              predicates:
                - Path=/api/workorders/**

            # Ruta hacia el microservicio de catálogo (servicios y repuestos)
            - id: catalog-service
              uri: ${CATALOG_URL:http://localhost:8082}
              predicates:
                - Path=/api/catalog/**

            # Ruta hacia el microservicio de técnicos
            - id: technicians-service
              uri: ${TECHNICIANS_URL:http://localhost:8084}
              predicates:
                - Path=/api/technicians/**
